name: Deploy to GitHub Pages

# Every pull request and every push to main is linted, tested (unit and browser) and built.
# Only a push to main is published.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets you re-run a deploy by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# If two deploys overlap, let the running one finish and keep only the newest waiting one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm's version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

      # Browser tests (including the accessibility audit) run against a build served from "/".
      # GITHUB_REPOSITORY is blanked so this build has no /<repo-name>/ prefix. The Chrome that
      # comes on GitHub's Ubuntu runners is used; no browser is downloaded.
      - name: Build for browser tests
        run: pnpm build
        env:
          GITHUB_REPOSITORY: ""
      - run: pnpm exec playwright test
      # If a browser test fails, the report (with screenshots and traces) is the fastest way to see why.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

      # The real build. next.config.ts reads GITHUB_REPOSITORY (set by Actions) to serve the site from /<repo-name>/.
      - name: Build for GitHub Pages
        run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    # Not for pull requests: they only check that the site still builds.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
